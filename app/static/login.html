<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快客盘 QuickPandown — 登录</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css?v=20261101c">
</head>
<body class="login-body">
  <div class="login-card">
    <h1 class="login-title">⚡ 快客盘 QuickPandown</h1>

    <div class="tabs">
      <button id="tab-login" class="tab active">登录</button>
      <button id="tab-register" class="tab">注册</button>
    </div>

    <!-- 登录表单 -->
    <form id="login-form" class="login-form" novalidate>
      <label>用户名
        <input id="login-username" autocomplete="username" required>
      </label>
      <label>密码
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <label>验证码
        <span class="captcha-row">
          <input id="login-captcha-input" maxlength="4" autocomplete="off" required>
          <img id="login-captcha-img" class="captcha-img" alt="验证码，点击刷新" title="看不清？点击刷新">
        </span>
      </label>
      <button type="submit" id="login-btn" class="primary">登录</button>
      <div id="login-message" class="hint"></div>
    </form>

    <!-- 注册表单 -->
    <form id="register-form" class="login-form hidden" novalidate>
      <label>用户名
        <input id="reg-username" autocomplete="username" required>
      </label>
      <label>邮箱
        <input id="reg-email" type="email" autocomplete="email" required>
      </label>
      <label>密码（至少 8 位）
        <input id="reg-password" type="password" autocomplete="new-password" required>
      </label>
      <label id="reg-invite-field">邀请码
        <input id="reg-invite" required>
      </label>
      <div id="invite-help" class="invite-help">
        <p class="invite-help-text">由于服务器资源有限，目前仅限邀请用户注册。你可以通过以下方式免费获取邀请码：</p>
        <div class="invite-actions">
          <a class="invite-action tg" href="https://t.me/playlab_group"
             target="_blank" rel="noopener noreferrer" title="加入 Telegram 群免费获取邀请码">
            <span class="invite-action-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path fill="currentColor" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
              </svg>
            </span>
            <span class="invite-action-label">Telegram</span>
          </a>
          <a class="invite-action qq" href="https://qm.qq.com/q/YpmXsCME8i"
             target="_blank" rel="noopener noreferrer" title="加入 QQ 群免费获取邀请码">
            <span class="invite-action-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path fill="currentColor" d="M21.395 15.035a40 40 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 0 12 0S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a39 39 0 0 0-.802 2.264c-1.021 3.283-.69 4.643-.438 4.673.54.065 2.103-2.472 2.103-2.472 0 1.469.756 3.387 2.394 4.771-.612.188-1.363.479-1.845.835-.434.32-.379.646-.301.778.343.578 5.883.369 7.482.189 1.6.18 7.14.389 7.483-.189.078-.132.132-.458-.301-.778-.483-.356-1.233-.646-1.846-.836 1.637-1.384 2.393-3.302 2.393-4.771 0 0 1.563 2.537 2.103 2.472.251-.03.581-1.39-.438-4.673"/>
              </svg>
            </span>
            <span class="invite-action-label">QQ 群</span>
          </a>
        </div>
      </div>
      <label>验证码
        <span class="captcha-row">
          <input id="reg-captcha-input" maxlength="4" autocomplete="off" required>
          <img id="reg-captcha-img" class="captcha-img" alt="验证码，点击刷新" title="看不清？点击刷新">
        </span>
      </label>
      <button type="submit" id="register-btn" class="primary">注册并登录</button>
      <div id="register-message" class="hint"></div>
    </form>
  </div>
  <script src="/login.js?v=20261101c"></script>
</body>
</html>
